name: Compilation du .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compiler
        shell: cmd
        run: build.bat
      - name: Garder l'exe comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: AssistantPC
          path: dist/AssistantPC.exe
      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AssistantPC.exe
